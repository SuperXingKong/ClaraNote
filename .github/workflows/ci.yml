name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    env:
      # Pipeline-using tests call the real OpenAI API. The fixture in
      # tests/conftest.py skips those tests when this secret is absent so
      # forks / draft PRs without the secret can still run validator tests.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff

      - name: Lint (ruff)
        run: ruff check clinical_ai tests

      - name: Test (pytest)
        run: pytest -q

  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (tsc -b && vite build)
        run: npm run build

  docker:
    name: Docker compose build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build

      - name: Smoke-run stack (healthz only — does not consume LLM tokens)
        env:
          WEB_PORT: "8090"
          # /healthz is reachable without an OpenAI key. The endpoint reports
          # whether a key is configured; we simply assert it responds 200.
          OPENAI_API_KEY: ""
        run: |
          docker compose up -d
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8090/api/healthz; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8090/api/healthz \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='ok' and d['llm_provider']=='openai'; print('healthz ok:', d)"
          docker compose down -v
