[project]
name = "clinical-ai"
version = "0.1.0"
description = "MVP clinical review draft generator with evidence mapping and safety validation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "openai>=1.99.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
clinical-ai-evaluate = "clinical_ai.app.evaluate:main"
clinical-ai-openai-key-test = "clinical_ai.app.openai_key_test:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["clinical_ai*"]
